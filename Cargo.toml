[workspace]
members = ["crates/*"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Zan Baldwin", "Claude Opus"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
anki = { git = "https://github.com/ankitects/anki", tag = "26.08.1" }
anki_proto = { git = "https://github.com/ankitects/anki", tag = "26.08.1" }
blake3 = { version = "1.8", default-features = false, features = [
    "std",
    "pure",
] }
clap = { version = "4", features = ["derive"] }
flate2 = "1.1"
getrandom = "0.4.3"
gix = { version = "0.89", default-features = false, features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "revision",
    "sha1",
    "sha256",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glob = "0.3.3"
indexmap = { version = "2.14", features = ["serde"] }
janky-anki = { path = "crates/anki" }
jsonc-parser = "0.34"
jsonschema = { version = "0.58", default-features = false }
memchr = "2.8"
minijinja = { version = "3.0", features = ["serde", "preserve_order"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "async"] }
miette = { version = "7.6", features = ["fancy"] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
] }
rusqlite = { version = "0.36.0", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = [
    "html",
] }
saphyr = "0.2.1"
schemars = { version = "1.2", features = ["indexmap2", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tar = "0.4.46"
tempfile = "3.27"
toml = { version = "1.1", features = ["preserve_order"] }
tokio = { version = "1.45", features = ["io-util", "rt", "time", "sync"] }
unicode-normalization = "0.1.25"
url = "2.5"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[patch."https://github.com/ankitects/anki"]
anki_proto = { path = "vendor/anki/rslib/proto" }
