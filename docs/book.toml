[book]
title = "Janky User Guide"
authors = ["Zan Baldwin"]
language = "en"
src = "src"

[rust]
edition = "2024"

[preprocessor.index]
[preprocessor.links]

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
no-section-label = false
smart-punctuation = true
mathjax-support = false
[output.html.fold]
enable = true
level = 1
[output.html.search]
enable = true
limit-results = 25
[output.html.playground]
runnable = false
