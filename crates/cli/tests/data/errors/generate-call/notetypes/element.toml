name = "Element"

[schema]
symbol = { type = "string", required = true }

[fields.symbol]
name = "Symbol"

[fields.broken]
name = "Broken"
value = "{{ entry.symbol | media('broken') }}"

[fields.wrong]
name = "Wrong"
value = "{{ entry.symbol | media('wrong') }}"

[fields.unknown]
name = "Unknown"
value = "{{ media(entry.symbol, 'nobody') }}"

[cards.recognition]
name = "Recognition"
front = "cards/front.html"
back = "cards/front.html"
