name = "Element"
assets = ["assets/bad.js"]

[schema]
symbol = { type = "string", required = true }
examples = { type = "list", of = { type = "string" } }

[fields.symbol]
name = "Symbol"
value = "{{ entry.symbol | markdwn }}"

[fields.property]
name = "Property"
value = "{{ entry.symbol | upper }"

[fields.examples]
name = "Examples"

[fields.extra]
name = "Extra"
template = "fields/extra.html.j2"

[fields.call]
name = "Call"
value = "{{ speak(entry.symbol) }}"

[cards.recognition]
name = "Recognition"
front = "cards/front.html"
back = "cards/back.html"

[cards.production]
name = "Production"
front = "cards/front.html"
back = "cards/back.html"
when = "entry.symbol =="
