name = "Chemical Element"
sort_field = "symbol"

[schema]
id       = { type = "slug", required = true }
symbol   = { type = "string", required = true }
name     = { type = "string", required = true }
hint     = { type = "string" }
state    = { type = "enum", values = ["🧊 solid", "💧 liquid", "💨 gas"] }
notes    = { type = "markdown" }
image    = { type = "media" }
compound = { type = "object", schema = "compound" }
examples = { type = "list", of = { type = "object", schema = "compound" } }
cards    = { type = "list", of = { type = "enum", values = ["production", "compound"] } }

[schema.defs.compound]
formula   = { type = "string", required = true }
name      = { type = "string", required = true }
highlight = { type = "string" }

[fields.symbol]
name = "Symbol"

[fields.name]
name = "Name"

[cards.recognition]
name = "Recognition"
front = "cards/front.html"
back = "cards/back.html"
